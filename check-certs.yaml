---
- name: Verificar certificados do OpenShift e Exportar Métricas
  hosts: localhost
  gather_facts: false

  vars:
    pushgateway_url: "{{ lookup('env', 'PUSHGATEWAY_URL') | default('http://pushgateway.cert-monitor.svc.cluster.local:9091', true) }}"
    # Tipos de Secret que nunca carregam certificados de interesse (ou são grandes demais para trazer à toa)
    secret_types_ignorados:
      - kubernetes.io/service-account-token
      - kubernetes.io/dockercfg
      - kubernetes.io/dockerconfigjson
      - helm.sh/release.v1
    # Só as chaves de Secret/ConfigMap com estas extensões são lidas
    extensoes_certificado: ['.crt', '.pem', '.cer', '.cert']
    # Limites (em bytes UTF-8) que o cryptography valida; fora deles ele só emite um UserWarning
    limites_rfc5280:
      commonName: [1, 64]
      countryName: [2, 2]
      jurisdictionCountryName: [2, 2]
    # Por quanto tempo a marcação de renovação (cert_renewed_timestamp_seconds) é mantida
    renovacao_retencao_dias: 7
    epoch_zero: '1970-01-01 00:00:00'
    # Só base64 e espaços entre os marcadores: mantém a busca linear. Com [\s\S]+? um valor com muitos
    # BEGIN sem END (ConfigMap malicioso em qualquer namespace) tinha custo quadrático e travava a varredura.
    pem_regex: '-----BEGIN CERTIFICATE-----[A-Za-z0-9+/=\s]+?-----END CERTIFICATE-----'

  tasks:
    - name: Buscar ConfigMap de exclusão
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: cert-monitor-exclude
        namespace: cert-monitor
      register: exclude_cm

    - name: Construir regex de namespaces e recursos ignorados
      ansible.builtin.set_fact:
        # Chave ausente ou lista vazia resulta em ^$ (nada é ignorado)
        regex_ignorados: >-
          {%- set data = exclude_cm.resources[0].data | default({}) if exclude_cm.resources | length > 0 else {} -%}
          {%- set lista = (data.namespaces | default('') | from_yaml) or [] -%}
          {%- if lista -%}
            ^(?:{{ lista | join('|') }})$
          {%- else -%}
            ^$
          {%- endif -%}
        regex_nomes_ignorados: >-
          {%- set data = exclude_cm.resources[0].data | default({}) if exclude_cm.resources | length > 0 else {} -%}
          {%- set lista = (data.nomes | default('') | from_yaml) or [] -%}
          {%- if lista -%}
            ^(?:{{ lista | join('|') }})$
          {%- else -%}
            ^$
          {%- endif -%}

    - name: Buscar os Secrets do cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        field_selectors: "{{ secret_types_ignorados | map('regex_replace', '^', 'type!=') | list }}"
      register: secrets_brutos
      no_log: true

    - name: Buscar todos os ConfigMaps no cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
      register: configmaps_brutos

    # Cada certificado de um bundle/cadeia vira uma entrada própria (campo indice).
    # Só os blocos BEGIN/END CERTIFICATE são guardados, nunca chaves privadas.
    - name: Extrair e organizar certificados
      ansible.builtin.set_fact:
        lista_certificados: >-
          {%- set result = [] -%}
          {%- set fontes = [] -%}
          {%- for sec in secrets_brutos.resources if sec.data | default({}) -%}
            {%- set _ = fontes.append({'obj': sec, 'tipo': 'SECRET', 'data': sec.data, 'b64': true}) -%}
          {%- endfor -%}
          {%- for cm in configmaps_brutos.resources -%}
            {%- if cm.data | default({}) -%}
              {%- set _ = fontes.append({'obj': cm, 'tipo': 'CONFIGMAP', 'data': cm.data, 'b64': false}) -%}
            {%- endif -%}
            {%- if cm.binaryData | default({}) -%}
              {%- set _ = fontes.append({'obj': cm, 'tipo': 'CONFIGMAP', 'data': cm.binaryData, 'b64': true}) -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for f in fontes if not (f.obj.metadata.namespace | regex_search(regex_ignorados))
                                and not (f.obj.metadata.name | regex_search(regex_nomes_ignorados)) -%}
            {%- for k, v in f.data.items() if (k | splitext | last) in extensoes_certificado -%}
              {%- set texto = v | b64decode if f.b64 else v -%}
              {%- for pem in texto | regex_findall(pem_regex) -%}
                {%- set _ = result.append({'ns': f.obj.metadata.namespace, 'name': f.obj.metadata.name, 'key': k,
                                           'tipo': f.tipo, 'indice': loop.index0, 'pem': pem}) -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ result }}
      no_log: true

    # O mesmo certificado costuma aparecer em vários recursos; cada PEM é analisado uma única vez.
    - name: Listar certificados únicos
      ansible.builtin.set_fact:
        pems_unicos: "{{ lista_certificados | map(attribute='pem') | unique | list }}"
      no_log: true

    # O filtro roda no próprio processo do Ansible (o módulo abriria um processo por certificado).
    # PEM inválido faz o filtro falhar; failed_when: false mantém o loop e o item fica sem ansible_facts.
    - name: Analisar a validade de cada certificado
      ansible.builtin.set_fact:
        cert_info_atual: "{{ item | community.crypto.x509_certificate_info }}"
      loop: "{{ pems_unicos }}"
      register: cert_info_results
      failed_when: false
      no_log: true

    - name: Indexar informações por certificado
      ansible.builtin.set_fact:
        info_por_pem: >-
          {{ dict(pems_unicos | zip(cert_info_results.results
                                    | map(attribute='ansible_facts', default={})
                                    | map(attribute='cert_info_atual', default={}))) }}
      no_log: true

    # Os avisos do cryptography (atributo fora do limite, número de série não positivo) não dizem qual
    # certificado viola a RFC; aqui cada ocorrência é identificada.
    # Só metadados e atributos do subject/issuer são exibidos (já presentes nas métricas).
    - name: Listar certificados fora dos limites da RFC 5280
      ansible.builtin.debug:
        msg: "{{ certificados_fora_rfc }}"
      when: certificados_fora_rfc | length > 0
      vars:
        certificados_fora_rfc: >-
          {%- set result = [] -%}
          {%- for cert in lista_certificados -%}
            {%- set info = info_por_pem[cert.pem] -%}
            {%- for parte in ['subject', 'issuer'] -%}
              {%- for attr, limite in limites_rfc5280.items() if attr in info[parte] | default({}) -%}
                {%- set valor = info[parte][attr] -%}
                {%- set tamanho = valor.encode('utf-8') | length -%}
                {%- if tamanho < limite[0] or tamanho > limite[1] -%}
                  {%- set _ = result.append(cert.ns ~ '/' ~ cert.name ~ ' (' ~ cert.tipo ~ ', chave ' ~ cert.key ~ ', posição ' ~ cert.indice ~ '): '
                                            ~ parte ~ ' ' ~ attr ~ ' com ' ~ tamanho ~ ' bytes (RFC 5280: ' ~ limite[0] ~ '–' ~ limite[1] ~ ') = "' ~ valor ~ '"') -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- if info.serial_number is defined and info.serial_number | int <= 0 -%}
              {%- set _ = result.append(cert.ns ~ '/' ~ cert.name ~ ' (' ~ cert.tipo ~ ', chave ' ~ cert.key ~ ', posição ' ~ cert.indice ~ '): '
                                        ~ 'número de série não positivo (' ~ info.serial_number ~ '), RFC 5280 exige inteiro positivo; CN = "'
                                        ~ info.subject.commonName | default('') ~ '"') -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    # O estado da varredura anterior fica no próprio Pushgateway. Sem ele (primeira execução, Pushgateway
    # recriado ou indisponível) nenhuma renovação é detectada; uma falha real aparece no envio (PUT).
    - name: Ler o estado anterior no Pushgateway
      ansible.builtin.uri:
        url: "{{ pushgateway_url }}/api/v1/metrics"
        timeout: 30
      register: estado_anterior
      failed_when: false
      no_log: true

    - name: Registrar o horário da varredura
      ansible.builtin.set_fact:
        agora_epoch: "{{ (now(utc=true) - (epoch_zero | to_datetime)).total_seconds() | int }}"

    # Renovado = certificado com uma data de expiração que não existia, na varredura anterior, na mesma chave
    # (namespace, tipo, nome, chave) já monitorada. Recurso novo não conta; reordenar um bundle também não.
    # Marcações anteriores são mantidas com o horário original por renovacao_retencao_dias.
    - name: Detectar certificados renovados
      ansible.builtin.set_fact:
        renovacoes: >-
          {%- set grupo = (estado_anterior.json | default({})).data | default([])
                          | selectattr('labels.job', 'defined') | selectattr('labels.job', 'equalto', 'cert_monitor')
                          | first | default({}) -%}
          {%- set vistos = {} -%}
          {%- for m in (grupo.cert_not_after_timestamp_seconds | default({})).metrics | default([]) -%}
            {%- set g = [m.labels['cert_namespace'], m.labels['tipo'], m.labels['name'], m.labels['key']] | join('|') -%}
            {%- set _ = vistos.update({g: (vistos[g] | default([])) + [m.labels['not_after']]}) -%}
          {%- endfor -%}
          {%- set marcas = {} -%}
          {%- for m in (grupo.cert_renewed_timestamp_seconds | default({})).metrics | default([]) -%}
            {%- set _ = marcas.update({[m.labels['cert_namespace'], m.labels['tipo'], m.labels['name'], m.labels['key'],
                                        m.labels['subject_cn'], m.labels['not_after']] | join('|'): m['value'] | float | int}) -%}
          {%- endfor -%}
          {%- set result = [] -%}
          {%- for cert in lista_certificados if info_por_pem[cert.pem].not_after is defined -%}
            {%- set res = info_por_pem[cert.pem] -%}
            {%- set cn = (res.subject.commonName | default('')) | replace('\n', ' ') -%}
            {%- set g = [cert.ns, cert.tipo, cert.name, cert.key] | join('|') -%}
            {%- set marca = [g, cn, res.not_after] | join('|') -%}
            {%- set item = {'ns': cert.ns, 'tipo': cert.tipo, 'name': cert.name, 'key': cert.key,
                            'indice': cert.indice, 'cn': cn, 'not_after': res.not_after} -%}
            {%- if g in vistos and res.not_after not in vistos[g] -%}
              {%- set _ = result.append(item | combine({'ts': agora_epoch | int})) -%}
            {%- elif marca in marcas and (agora_epoch | int) - marcas[marca] < renovacao_retencao_dias * 86400 -%}
              {%- set _ = result.append(item | combine({'ts': marcas[marca]})) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}
      no_log: true

    # Datas ASN.1 são UTC; subtrair o epoch como datetime ingênuo evita depender do TZ do container.
    - name: Gerar payload de métricas do Prometheus
      ansible.builtin.set_fact:
        prometheus_payload: |
          # HELP cert_not_after_timestamp_seconds Data de expiração do certificado (epoch UTC)
          # TYPE cert_not_after_timestamp_seconds gauge
          {% for cert in lista_certificados %}
          {% set res = info_por_pem[cert.pem] %}
          {% if res.not_after is defined %}
          {% set expiracao = ((res.not_after | to_datetime('%Y%m%d%H%M%SZ')) - (epoch_zero | to_datetime)).total_seconds() | int %}
          {% set cn = (res.subject.commonName | default('')) | replace('\\', '\\\\') | replace('"', '\\"') | replace('\n', ' ') %}
          cert_not_after_timestamp_seconds{cert_namespace="{{ cert.ns }}",tipo="{{ cert.tipo }}",name="{{ cert.name }}",key="{{ cert.key }}",indice="{{ cert.indice }}",subject_cn="{{ cn }}",not_after="{{ res.not_after }}"} {{ expiracao }}
          {% endif %}
          {% endfor %}
          # HELP cert_renewed_timestamp_seconds Momento em que a renovação do certificado foi detectada (epoch UTC)
          # TYPE cert_renewed_timestamp_seconds gauge
          {% for r in renovacoes %}
          {% set cn = r.cn | replace('\\', '\\\\') | replace('"', '\\"') %}
          cert_renewed_timestamp_seconds{cert_namespace="{{ r.ns }}",tipo="{{ r.tipo }}",name="{{ r.name }}",key="{{ r.key }}",indice="{{ r.indice }}",subject_cn="{{ cn }}",not_after="{{ r.not_after }}"} {{ r.ts }}
          {% endfor %}
          # HELP cert_monitor_certificates Certificados encontrados na última varredura
          # TYPE cert_monitor_certificates gauge
          cert_monitor_certificates {{ lista_certificados | length }}
          # HELP cert_monitor_parse_errors Certificados únicos que não puderam ser analisados
          # TYPE cert_monitor_parse_errors gauge
          cert_monitor_parse_errors {{ info_por_pem.values() | selectattr('not_after', 'undefined') | list | length }}
          # HELP cert_monitor_last_run_timestamp_seconds Momento da última varredura concluída (epoch UTC)
          # TYPE cert_monitor_last_run_timestamp_seconds gauge
          cert_monitor_last_run_timestamp_seconds {{ agora_epoch }}
      no_log: true

    # PUT substitui o grupo inteiro: certificados removidos do cluster somem do Pushgateway.
    - name: Enviar métricas para o Pushgateway
      ansible.builtin.uri:
        url: "{{ pushgateway_url }}/metrics/job/cert_monitor"
        method: PUT
        body: "{{ prometheus_payload }}"
        status_code: [200, 202]
