---
# Persistência das métricas do Pushgateway: sobrevivem à recriação do pod (deploy, troca de nó, drain),
# incluindo as marcações de renovação. Sem storageClassName, usa a StorageClass padrão do cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pushgateway-data
  namespace: cert-monitor
  labels:
    app: pushgateway
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: cert-monitor
  labels:
    app: pushgateway
spec:
  replicas: 1
  # Volume ReadWriteOnce: o pod antigo precisa liberar o volume antes de o novo subir
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      # O Pushgateway não acessa a API do Kubernetes
      automountServiceAccountToken: false
      containers:
      - name: pushgateway
        image: quay.io/prometheus/pushgateway:v1.11.5
        args:
        # Grava as métricas no PVC a cada minuto e as recarrega ao iniciar
        - --persistence.file=/data/metrics
        - --persistence.interval=1m
        ports:
        - containerPort: 9091
          name: metrics
        readinessProbe:
          httpGet:
            path: /-/ready
            port: metrics
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: metrics
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pushgateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: cert-monitor
  labels:
    app: pushgateway
spec:
  selector:
    app: pushgateway
  ports:
  - port: 9091
    targetPort: metrics
    name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway-monitor
  namespace: cert-monitor
spec:
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    honorLabels: true
---
# Só o CronJob pode enviar métricas e só o Prometheus da plataforma/user workload pode coletá-las
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway-ingress
  namespace: cert-monitor
spec:
  podSelector:
    matchLabels:
      app: pushgateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: cert-monitor
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    ports:
    - port: 9091
      protocol: TCP
