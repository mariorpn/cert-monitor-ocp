---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: cert-monitor
  labels:
    app: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
      - name: pushgateway
        image: docker.io/prom/pushgateway:latest
        ports:
        - containerPort: 9091
          name: metrics
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: cert-monitor
  labels:
    app: pushgateway
spec:
  selector:
    app: pushgateway
  ports:
  - port: 9091
    targetPort: metrics
    name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway-monitor
  namespace: cert-monitor
spec:
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    honorLabels: true