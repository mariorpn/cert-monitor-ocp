---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ansible-cert-monitor
  namespace: cert-monitor
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ansible-cert-monitor-build
  namespace: cert-monitor
spec:
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: "ansible-cert-monitor:latest"