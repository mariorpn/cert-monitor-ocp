name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          pip install yamllint ansible-lint -r requirements.txt
          ansible-galaxy collection install -r requirements.yml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint check-certs.yaml

      - name: kubeconform
        run: |
          kubectl kustomize . | ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip ImageStream,BuildConfig
