name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  KUBECONFORM_VERSAO: v0.6.7
  # sha256 de kubeconform-linux-amd64.tar.gz, do arquivo CHECKSUMS da release
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

jobs:
  # Mesmo id de antes para não quebrar regras de proteção de branch; roda o caderno de testes completo
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          pip install yamllint ansible-lint -r requirements.txt
          ansible-galaxy collection install -r requirements.yml
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSAO}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          sudo tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
          rm kubeconform.tar.gz

      # yamllint, ansible-lint, kustomize, kubeconform, testes do playbook e das regras de alerta
      - name: Caderno de testes (tests/run.sh)
        run: tests/run.sh
