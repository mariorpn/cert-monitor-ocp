apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-monitor-exclude
  namespace: cert-monitor
data:
  # Regex (casamento exato) dos namespaces ignorados na varredura.
  # openshift-config (certificado custom da API) e openshift-ingress (certificado do router)
  # continuam monitorados, pois são renovados manualmente.
  namespaces: |
    - openshift-(?!config$|ingress$).*
    - openshift
    - kube.*
    - default
    - projeto-legado
  # Regex (casamento exato) dos nomes de Secret/ConfigMap ignorados em qualquer namespace.
  # - kube-root-ca.crt / openshift-service-ca.crt: replicados em todos os namespaces e rotacionados pela plataforma.
  # - config-trusted-cabundle / trusted-ca-bundle: bundles injetados pelo OpenShift (label
  #   config.openshift.io/inject-trusted-cabundle) com todas as CAs públicas do sistema. CAs customizadas
  #   do cluster continuam monitoradas na origem: openshift-config/user-ca-bundle.
  nomes: |
    - kube-root-ca\.crt
    - openshift-service-ca\.crt
    - config-trusted-cabundle
    - trusted-ca-bundle
