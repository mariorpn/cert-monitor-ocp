apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-monitor-exclude
  namespace: cert-monitor
data:
  # Regex (casamento exato) dos namespaces ignorados na varredura.
  # openshift-config (certificado custom da API) e openshift-ingress (certificado do router)
  # continuam monitorados, pois são renovados manualmente.
  namespaces: |
    - openshift-(?!config$|ingress$).*
    - openshift
    - kube.*
    - default
    - projeto-legado
  # Regex (casamento exato) dos nomes de Secret/ConfigMap ignorados em qualquer namespace.
  # Os CAs abaixo são replicados em todos os namespaces e rotacionados pela própria plataforma.
  nomes: |
    - kube-root-ca\.crt
    - openshift-service-ca\.crt
